<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银龄守护 · 智慧养老演示系统</title>
    <meta http-equiv="refresh" content="0; url=login.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/common.css">
</head>
<body class="bg-gradient-to-br from-orange-50 via-rose-50 to-amber-50 min-h-screen flex items-center justify-center p-6">
    <div class="text-center bg-white rounded-3xl shadow-xl p-10 max-w-md w-full">
        <div class="text-6xl mb-3 breathe">🏠</div>
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-500 via-orange-500 to-amber-500 mb-2">银龄守护</h1>
        <p class="text-gray-500 text-sm mb-6">正在进入登录页…</p>
        <a href="login.html" class="inline-block px-8 py-3 bg-gradient-to-r from-rose-500 to-orange-500 text-white font-bold rounded-xl quick-btn">如果没有自动跳转，请点击这里</a>

        <div class="mt-8 text-left text-xs text-gray-500 leading-relaxed">
            <p class="font-bold text-gray-600 mb-1">页面清单（一个身份一个页面）</p>
            <p>· <code>login.html</code> —— 登录入口（选择身份后登录）</p>
            <p>· <code>old.html</code> —— 老人端（仅老人账号可见）</p>
            <p>· <code>family.html</code> —— 家属端（仅家属账号可见）</p>
            <p>· <code>grid.html</code> —— 网格员端（仅网格员账号可见）</p>
            <p>· <code>manager.html</code> —— 管理者大屏（仅管理员账号可见）</p>
        </div>
    </div>
    <script>setTimeout(function () { location.replace('login.html'); }, 600);</script>
</body>
</html>
